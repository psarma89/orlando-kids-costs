const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) {
    msg.textContent = "This browser cannot open the page. Use a current Chrome, Safari, Edge, or Firefox.";
    return;
  }
  msg.style.color = "#57606a";
  msg.textContent = "Opening...";
  let zipped;
  try {
    const pw = new TextEncoder().encode(document.getElementById("pw").value.normalize("NFC"));
    const base = await crypto.subtle.importKey("raw", pw, "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(D.salt), iterations: D.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    zipped = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(D.iv) }, key, bytes(D.ct));
  } catch (err) {
    msg.style.color = "#cf222e";
    msg.textContent = "Wrong password.";
    return;
  }
  try {
    const html = await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    msg.style.color = "#cf222e";
    msg.textContent = "The password is right, but this browser could not open the page. Try a current Chrome, Safari, Edge, or Firefox.";
  }
});
